[package]
name = "kriptag"
version = "0.6.0"
description = "Local-first organiser with optional AI"
authors = ["kriptogramma"]
edition = "2021"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kriptag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "migrate", "uuid"] }
tokio = { version = "1", features = ["full"] }
sysinfo = "0.33"
# Путь к данным для CLI-режима --status (без AppHandle); тот же крейт,
# которым tauri резолвит app_data_dir — пути совпадают на всех ОС.
dirs = "6"
zip = "8.6.0"
# Snowball stemming for note search. Pure Rust, no C dependency — checked before
# choosing it, along with the two cheaper options that did not work: FTS5 ships a
# `porter` tokenizer, but Porter is English (it finds "running" from "run" and
# nothing at all for "покупки"/"покупок"), and `trigram` matches substrings but
# makes snippet() highlight three letters instead of the word.
rust-stemmers = "1.2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-clipboard-manager = "2"
thiserror = "2.0.18"
keyring = "4.1.2"
tauri-plugin-single-instance = "2.4.3"
base64 = "0.22"
# Pinned below 0.18 on purpose. cpal 0.18 wants windows-core 0.62 while tao (via
# tauri) is on 0.61, and two copies of that crate in one graph make its Interface
# trait two unrelated types — cpal itself then fails to compile on Windows with a
# wall of mismatched-type errors. Linux never sees this. Raise only once tauri
# has moved to windows-core 0.62; the API differs slightly (build_input_stream
# takes the config by reference here, by value in 0.18).
cpal = "0.17"
hound = "3.5.1"

# Buttons in notifications: tauri-plugin-notification accepts them in its builder
# but ignores them entirely on desktop (verified against 2.3.3, desktop.rs::show()
# passes only title/body/icon/sound into notify_rust). The lower layer does support
# the protocol, so on Linux we call it directly; see notifier/actions.rs.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
# Wayland is a Linux display protocol, and these crates are written against it:
# wayland-sys reaches for std::os::unix, which does not exist on Windows, so as
# an unconditional dependency it fails the Windows build before any code of ours
# is compiled. Used by monitor::wayland_idle, which is gated the same way.
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
