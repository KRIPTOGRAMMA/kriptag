[package]
name = "kriptag"
version = "0.6.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kriptag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "migrate", "uuid"] }
tokio = { version = "1", features = ["full"] }
sysinfo = "0.33"
# Путь к данным для CLI-режима --status (без AppHandle); тот же крейт,
# которым tauri резолвит app_data_dir — пути совпадают на всех ОС.
dirs = "6"
zip = "8.6.0"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-clipboard-manager = "2"
thiserror = "2.0.18"
keyring = "4.1.2"
tauri-plugin-single-instance = "2.4.3"
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
base64 = "0.22"
cpal = "0.18.1"
hound = "3.5.1"

# Buttons in notifications: tauri-plugin-notification accepts them in its builder
# but ignores them entirely on desktop (verified against 2.3.3, desktop.rs::show()
# passes only title/body/icon/sound into notify_rust). The lower layer does support
# the protocol, so on Linux we call it directly; see notifier/actions.rs.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
