name: Release

# Builds installers on a tag and attaches them to a GitHub Release.
#
# The point of doing this here rather than locally: Tauri renders the interface
# with the *system* webview — WebKitGTK on Linux, WebView2 on Windows. Those are
# different libraries, so a Windows installer cannot be produced on a Linux
# machine at all; it has to be built on Windows. GitHub gives a real Windows
# runner with WebView2 and the MSVC toolchain already installed, which is the
# only supported way to get a .exe out of this project.
on:
  push:
    tags: ["v*"]
  # Manual runs build the same artifacts without publishing, so the pipeline can
  # be verified before a tag exists.
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # WebKitGTK and the tray library. Ubuntu 22.04 is pinned deliberately:
      # a package built against a newer glibc will not run on older systems,
      # and the runner's default moves over time.
      - name: System dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libasound2-dev \
            libgdk-pixbuf-2.0-dev

      - uses: dtolnay/rust-toolchain@stable

      # Cargo's registry and the build directory are the slow part of a cold run.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the runners now force Node 20 actions onto 24 and warn
          # about it, so pinning 20 buys nothing.
          node-version: 22
          cache: npm

      - run: npm ci

      # whisper-cli is built from source because upstream only publishes
      # shared-library archives: the binary needs a dozen .so files beside it,
      # and a Tauri sidecar is a single file with nowhere to put them.
      #
      # The cache key is the version alone — the output depends on nothing else
      # in this repo, so it is compiled once and reused until v1.9.2 changes.
      - name: Cache whisper-cli
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries/whisper-cli-*
          key: whisper-v1.9.2-${{ matrix.os }}

      # GGML_NATIVE=OFF is not optional: the default -march=native targets the
      # runner's own CPU, and the resulting binary dies with SIGILL on any older
      # machine that installs the package.
      - name: Build whisper-cli
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch v1.9.2 https://github.com/ggerganov/whisper.cpp /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF -DWHISPER_BUILD_TESTS=OFF
          cmake --build /tmp/whisper.cpp/build -j --config Release
          mkdir -p src-tauri/binaries
          # The Visual Studio generator is multi-config and puts the binary in
          # bin/Release/, while Makefiles put it in bin/ — find it rather than
          # assume, so a generator change cannot silently break the copy.
          if [ "${{ matrix.target }}" = "windows" ]; then
            src=$(find /tmp/whisper.cpp/build -name whisper-cli.exe -type f | head -1)
            dest=src-tauri/binaries/whisper-cli-x86_64-pc-windows-msvc.exe
          else
            src=$(find /tmp/whisper.cpp/build -name whisper-cli -type f | head -1)
            dest=src-tauri/binaries/whisper-cli-x86_64-unknown-linux-gnu
          fi
          # An empty $src would make cp fail obscurely, or worse, succeed at
          # copying nothing; the build must stop here instead.
          test -n "$src" || { echo "whisper-cli not found under build/"; exit 1; }
          cp "$src" "$dest"
          chmod +x "$dest"
          echo "whisper-cli: $src -> $dest"

      # src-tauri/binaries/ is gitignored (llamafile alone is ~350 MB), so a clean
      # checkout has no sidecars and the bundler fails hard without them. The
      # script also drops whisper-cli from externalBin when it cannot be
      # provided, which is why this must run before the build.
      - name: Fetch sidecars
        run: node scripts/fetch-sidecars.mjs

      # A bare "exit code 1" from tauri-action says nothing about what failed, so
      # the state it depends on is printed first: which sidecars exist, and what
      # externalBin ended up as after the fetch step edited it.
      - name: Show sidecar state
        shell: bash
        run: |
          echo "--- src-tauri/binaries ---"
          ls -la src-tauri/binaries/ || echo "(no directory)"
          echo "--- externalBin ---"
          node -e "console.log(JSON.stringify(require('./src-tauri/tauri.conf.json').bundle.externalBin))"

      # Run the frontend build on its own. tauri-action calls it through
      # beforeBuildCommand, where a failure is reported only as the exit code of
      # the whole build — this separates "the frontend broke" from "the bundler
      # broke".
      - name: Build frontend
        run: npm run build

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A tag run publishes a draft release; a manual run only builds, so
          # the pipeline can be checked without shipping anything.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Kriptag ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # Both platforms name their bundle explicitly rather than inheriting
          # tauri.conf.json's targets.
          #
          # AppImage needs libgdk-pixbuf-2.0-dev above: linuxdeploy's gtk plugin
          # asks pkg-config for the loader directory and copies it, and where the
          # path is declared but absent the plugin exits 1 and takes the whole
          # build with it — losing a working .deb along with it. That is why the
          # two are listed together and not left to tauri.conf.json.
          args: ${{ matrix.target == 'windows' && '--bundles nsis' || '--bundles deb,appimage' }}

      # Kept even for manual runs: without an artifact there is nothing to
      # inspect when a build behaves differently from the local one.
      - uses: actions/upload-artifact@v4
        with:
          name: kriptag-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
