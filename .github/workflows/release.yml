name: Release

# Builds installers on a tag and attaches them to a GitHub Release.
#
# The point of doing this here rather than locally: Tauri renders the interface
# with the *system* webview — WebKitGTK on Linux, WebView2 on Windows. Those are
# different libraries, so a Windows installer cannot be produced on a Linux
# machine at all; it has to be built on Windows. GitHub gives a real Windows
# runner with WebView2 and the MSVC toolchain already installed, which is the
# only supported way to get a .exe out of this project.
on:
  push:
    tags: ["v*"]
  # Manual runs build the same artifacts without publishing, so the pipeline can
  # be verified before a tag exists.
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux
          - os: windows-latest
            target: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # WebKitGTK and the tray library. Ubuntu 22.04 is pinned deliberately:
      # a package built against a newer glibc will not run on older systems,
      # and the runner's default moves over time.
      - name: System dependencies (Linux)
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      # Cargo's registry and the build directory are the slow part of a cold run.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the runners now force Node 20 actions onto 24 and warn
          # about it, so pinning 20 buys nothing.
          node-version: 22
          cache: npm

      - run: npm ci

      # src-tauri/binaries/ is gitignored (llamafile alone is ~300 MB), so a
      # clean checkout has no sidecars and the bundler fails hard without them.
      # src-tauri/binaries/ is gitignored (llamafile alone is ~200 MB), so a clean
      # checkout has no sidecars and the bundler fails hard without them. The
      # script also drops whisper-cli from externalBin when it cannot be
      # provided, which is why this must run before the build.
      - name: Fetch sidecars
        run: node scripts/fetch-sidecars.mjs

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # A tag run publishes a draft release; a manual run only builds, so
          # the pipeline can be checked without shipping anything.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Kriptag ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # The Linux targets come from tauri.conf.json; Windows needs its own,
          # and NSIS produces the familiar setup .exe.
          args: ${{ matrix.target == 'windows' && '--bundles nsis' || '' }}

      # Kept even for manual runs: without an artifact there is nothing to
      # inspect when a build behaves differently from the local one.
      - uses: actions/upload-artifact@v4
        with:
          name: kriptag-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
